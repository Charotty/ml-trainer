
# Deployment Configuration

api:
  host: "0.0.0.0"
  port: 8000
  debug: false

model:
  path: "data/models/adaptive_ensemble.pkl"
  backup_path: "data/models/backup/"

logging:
  level: "INFO"
  file: "logs/prediction_service.log"
  max_size: "10MB"
  backup_count: 5

monitoring:
  enable_drift_detection: true
  drift_threshold: 0.1
  check_interval: 3600  # 1 hour
