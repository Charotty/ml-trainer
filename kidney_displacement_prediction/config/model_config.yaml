
# Model Configuration for Kidney Displacement Prediction

ensemble:
  strategy: "adaptive"  # adaptive, target_specific, voting
  weights:
    kidney_left_delta_x:
      RandomForest: 2.5
      Lasso: 1.0
      Ridge: 0.8
      GradientBoosting: 0.6
    kidney_left_delta_y:
      RandomForest: 1.5
      Lasso: 2.0
      Ridge: 1.2
      GradientBoosting: 0.8
    # ... other targets

models:
  RandomForest:
    n_estimators: 500
    max_depth: 20
    min_samples_split: 10
    min_samples_leaf: 4
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1
  
  Lasso:
    alpha: 0.1
    max_iter: 5000
    random_state: 42
  
  Ridge:
    alpha: 1.0
    solver: "auto"
    random_state: 42
  
  GradientBoosting:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    random_state: 42

evaluation:
  metrics: ["MAE", "RMSE", "R2", "Error_5mm", "Error_10mm"]
  cv_folds: 5
  test_size: 0.2
